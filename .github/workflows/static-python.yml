name: source-guardrails (not an MT5 build)
on:
  push:
  pull_request:
jobs:
  static-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: echo 'This is static Python testing only, NOT MetaEditor compilation or an MT5 backtest'